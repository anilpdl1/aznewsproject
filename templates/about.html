{% extends 'base.html' %}
{% load static %}

{% block title %}{{ page.title }} | News{% endblock %}

{% block content %}
<div class="about-area">
  <div class="container">
    <div class="row">
      <div class="col-lg-8">
        {% if page.image %}<div class="about-img"><img src="{{ page.image.url }}" alt="{{ page.title }}"></div>{% endif %}
        <div class="section-tittle mb-30 pt-30"><h1>{{ page.title }}</h1></div>
        <div class="about-prea">{{ page.body|linebreaks }}</div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
