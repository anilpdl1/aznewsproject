
{% if video_id %}
    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/{{ video_id }}"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>
{% endif %}
